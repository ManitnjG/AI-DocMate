name: Build and Release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-apk.yml'
      - '.release-trigger'
permissions:
  contents: write
jobs:
  checks:
    uses: ./.github/workflows/android.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AI-DocMate-debug-apk
          path: verified-apk
      - name: Package verified APK
        run: |
          cp verified-apk/app-debug.apk AI-DocMate-v0.8.0.apk
          sha256sum AI-DocMate-v0.8.0.apk > AI-DocMate-v0.8.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AI-DocMate-v0.8.0-apk
          path: |
            AI-DocMate-v0.8.0.apk
            AI-DocMate-v0.8.0.apk.sha256
          if-no-files-found: error
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.8.0 >/dev/null 2>&1; then
            gh release upload v0.8.0 AI-DocMate-v0.8.0.apk AI-DocMate-v0.8.0.apk.sha256 --clobber
          else
            gh release create v0.8.0 AI-DocMate-v0.8.0.apk AI-DocMate-v0.8.0.apk.sha256 --target "$GITHUB_SHA" --title "AI DocMate v0.8.0" --generate-notes --prerelease
          fi
