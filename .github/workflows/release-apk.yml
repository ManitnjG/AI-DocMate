name: Build and Release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-apk.yml'
      - '.release-trigger'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build release APK
        run: gradle testDebugUnitTest lintDebug assembleRelease
        env:
          DOCMATE_API_URL: ${{ vars.DOCMATE_API_URL }}
      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -storepass docmate082 -keypass docmate082 -alias docmate -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AI DocMate, OU=Android, O=AI DocMate, L=Chennai, ST=Tamil Nadu, C=IN"
      - name: Align and sign APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk AI-DocMate-v0.8.2-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias docmate --ks-pass pass:docmate082 --key-pass pass:docmate082 --out AI-DocMate-v0.8.2.apk AI-DocMate-v0.8.2-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs AI-DocMate-v0.8.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging AI-DocMate-v0.8.2.apk | head -20
          sha256sum AI-DocMate-v0.8.2.apk > AI-DocMate-v0.8.2.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AI-DocMate-v0.8.2-installable
          path: |
            AI-DocMate-v0.8.2.apk
            AI-DocMate-v0.8.2.apk.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.8.2 >/dev/null 2>&1; then
            gh release upload v0.8.2 AI-DocMate-v0.8.2.apk AI-DocMate-v0.8.2.apk.sha256 --clobber
          else
            gh release create v0.8.2 AI-DocMate-v0.8.2.apk AI-DocMate-v0.8.2.apk.sha256 --target "$GITHUB_SHA" --title "AI DocMate v0.8.2" --notes "Installable Android APK. APK alignment and cryptographic signature are verified in GitHub Actions before publication." --prerelease
          fi
