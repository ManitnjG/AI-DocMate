name: Build and Release APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/android.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AI-DocMate-debug-apk
          path: verified-apk
      - name: Package verified APK
        run: |
          cp verified-apk/app-debug.apk AI-DocMate-pilot.apk
          sha256sum AI-DocMate-pilot.apk > AI-DocMate-pilot.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AI-DocMate-verified-pilot-apk
          path: |
            AI-DocMate-pilot.apk
            AI-DocMate-pilot.apk.sha256
          if-no-files-found: error
      - name: Publish pilot GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            AI-DocMate-pilot.apk
            AI-DocMate-pilot.apk.sha256
          prerelease: true
          body: |
            Pilot debug APK. Passed backend tests, Android unit tests, lint and emulator integration tests.
            This is not a signed Google Play production release. Physical-device and OCR-quality verification remain required.
          generate_release_notes: true
